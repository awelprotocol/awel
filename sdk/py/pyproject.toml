[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "awel"
version = "0.5.0"
description = "Python client for Awel — the open API layer for agent-to-agent work"
readme = "../../README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "The Awel Authors" }]
keywords = ["agents", "x402", "usdc", "solana", "a2a"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "pynacl>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/awelprotocol/awel"
Repository = "https://github.com/awelprotocol/awel"
Documentation = "https://github.com/awelprotocol/awel/tree/main/spec"

[tool.hatch.build.targets.wheel]
packages = ["awel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
